[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "zotero-chemistry-agent"
version = "0.1.0"
description = "A local chemistry agent powered by DeepSeek, LangGraph, and RDKit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "filelock>=3.16,<4",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "pydantic-settings>=2.6,<3",
  "rdkit>=2024.9",
  "tokenizers>=0.22,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[project.scripts]
chemistry-agent = "chemistry_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chemistry_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
